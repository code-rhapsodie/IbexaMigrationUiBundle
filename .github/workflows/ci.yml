name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, mbstring, xml
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Drop QA-only dependency unsupported on PHP 8.1
        if: matrix.php == '8.1'
        run: composer remove --dev ekino/phpstan-banned-code --no-update

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Lint PHP
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Lint YAML and XLIFF
        run: |
          for f in src/Resources/config/*.yaml; do php -r 'require "vendor/autoload.php"; Symfony\Component\Yaml\Yaml::parseFile($argv[1], Symfony\Component\Yaml\Yaml::PARSE_CUSTOM_TAGS);' "$f"; done
          for f in src/Resources/translations/*.xlf; do php -r 'exit(simplexml_load_file($argv[1]) === false ? 1 : 0);' "$f"; done

      - name: PHP CS Fixer
        if: matrix.dependencies == 'highest' && matrix.php == '8.4'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        if: matrix.dependencies == 'highest' && matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Rector
        if: matrix.dependencies == 'highest' && matrix.php == '8.4'
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: PHPUnit
        run: vendor/bin/phpunit
